name: db-baseline

# One-shot: capture the LIVE production schema as the first migration and open
# a pull request with it. For machines that cannot run Docker (the Supabase CLI
# needs Docker for `db dump`). Run it from the Actions tab → db-baseline →
# "Run workflow". Requires the SUPABASE_* secrets described in supabase/README.md.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ]  && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_ID" ]   && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions). See supabase/README.md."
            exit 1
          fi

      - name: Refuse to run twice
        run: |
          if ls supabase/migrations/*_baseline.sql >/dev/null 2>&1; then
            echo "::error::A baseline migration already exists on main. Nothing to do."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dump production schema (public + storage, no data)
        id: dump
        run: |
          stamp=$(date -u +%Y%m%d%H%M%S)
          mkdir -p supabase/migrations
          supabase db dump --linked --schema public,storage -f "supabase/migrations/${stamp}_baseline.sql"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "Baseline: $(wc -c < supabase/migrations/${stamp}_baseline.sql) bytes"

      - name: Mark the baseline as already applied in production
        run: supabase migration repair --status applied "${{ steps.dump.outputs.stamp }}"

      - name: Generate TypeScript types
        run: |
          mkdir -p apps/web/src/types
          supabase gen types typescript --linked --schema public > apps/web/src/types/database.types.ts

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/db-baseline
          delete-branch: true
          commit-message: |
            chore(db): baseline production schema

            Generated by the db-baseline workflow from the live project.
            Marked as applied with `supabase migration repair`.
          title: "chore(db): baseline production schema"
          body: |
            Generated by the **db-baseline** workflow from the live Supabase project.

            - `supabase/migrations/${{ steps.dump.outputs.stamp }}_baseline.sql`: full `public` + `storage` schema (tables, RLS, policies, functions, triggers, buckets). No rows.
            - `apps/web/src/types/database.types.ts`: generated types.

            The baseline has already been recorded as applied in production (`supabase migration repair --status applied ${{ steps.dump.outputs.stamp }}`), so merging this does not change the database. From now on every schema change is a new file under `supabase/migrations/`, applied by the `db` workflow on merge.

            Review checklist:
            - [ ] The four September 2026 security scripts' effects are present (private buckets, owner-prefix storage policies, no `USING (true)` on user tables, RPC grants revoked)
            - [ ] No `CREATE TABLE` for tables the app no longer uses that you would rather drop in a follow-up migration
          labels: database
          add-paths: |
            supabase/migrations/*_baseline.sql
            apps/web/src/types/database.types.ts
