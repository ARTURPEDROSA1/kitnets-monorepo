name: db

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every PR that touches the database: apply ALL migrations to a fresh local
  # Postgres and lint them. Catches ordering mistakes, non-idempotent DDL and
  # typos before they reach production.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Skip until the baseline migration exists
        id: has_migrations
        run: |
          if ls supabase/migrations/*.sql >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::supabase/migrations is empty; run 'npm run db:baseline' once (see supabase/README.md)."
          fi

      # Anonymous pulls of ghcr.io/supabase/postgres from the shared runners get throttled
      # (toomanyrequests, four failures in a row on 2026-09-23); a login with the job's own
      # token uses the authenticated, far higher limit.
      - name: Log in to ghcr.io
        if: steps.has_migrations.outputs.present == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # setup-cli points the CLI at ghcr.io; on 2026-09-23 that registry answered every pull
      # with toomanyrequests even after a successful login (retry-after in microseconds — an
      # incident, not a quota). Supabase mirrors the same images on ECR Public, the CLI's own
      # default, which allows anonymous pulls.
      - name: Start local database and apply every migration
        if: steps.has_migrations.outputs.present == 'true'
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: supabase db start

      - name: Lint schema
        if: steps.has_migrations.outputs.present == 'true'
        run: supabase db lint --level warning

  # Merge to main: push the new migrations to production.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets are not configured; skipping db push. See supabase/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 2.117.0

      - name: Link project
        if: steps.secrets.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        if: steps.secrets.outputs.configured == 'true'
        # --include-all: apply local migrations even when their version is older than the
        # remote head. Parallel branches merge out of timestamp order (e.g. #35/#37 vs the
        # rate-limits migration); without it db push aborts and production drifts.
        run: supabase db push --include-all

      - name: List applied migrations
        if: steps.secrets.outputs.configured == 'true'
        run: supabase migration list
